name: Build HNStudio Musik AI (Electron Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-electron-windows:
    name: Build Electron Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Folder Structure & Install Dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json") -and (Test-Path "HNStudio-Musik-AI/package.json")) {
            Write-Host "Syncing from HNStudio-Musik-AI subfolder to root..."
            Copy-Item -Path "HNStudio-Musik-AI/*" -Destination "." -Recurse -Force
          }
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Executable (.exe Installer & Portable)
        run: npx --yes electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNStudio-Musik-AI-Windows-Installer
          path: |
            dist-electron/*.exe
          retention-days: 30
          if-no-files-found: error
